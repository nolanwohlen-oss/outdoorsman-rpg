name: Apply causal Phase 2M regression update

on:
  push:
    branches: [phase-2p-audit-fix]
    paths:
      - tools/fix_phase2p_audit_regression.py
      - .github/workflows/phase2p_audit_regression.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase-2p-audit-fix
      - name: Update historical regression
        run: python3 tools/fix_phase2p_audit_regression.py
      - name: Remove regression patch scaffolding
        run: git rm -f tools/fix_phase2p_audit_regression.py .github/workflows/phase2p_audit_regression.yml
      - name: Commit regression update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align Phase 2M regression with 2P weakest-link causality'
          git push origin HEAD:phase-2p-audit-fix
