name: Retry Phase 2P audit corrections

on:
  push:
    branches: [phase-2p-audit-fix]
    paths:
      - .github/workflows/phase2p_audit_retry.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase-2p-audit-fix
      - name: Correct audit driver duplicate-message anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_phase2p_audit.py')
          text = p.read_text()
          old = '''replace_once(
              "simulation/inventory.gd",
              'return {"ok": false, "message": "Select a tracked line or reel."}',
              'return {"ok": false, "message": "Select a tracked rig component."}',
          )
          replace_once(
              "simulation/inventory.gd",
              'return {"ok": false, "message": "Select a tracked line or reel."}',
              'return {"ok": false, "message": "Select a tracked rig component."}',
          )
          '''
          new = '''p = ROOT / "simulation/inventory.gd"
          text = p.read_text()
          old_message = 'return {"ok": false, "message": "Select a tracked line or reel."}'
          new_message = 'return {"ok": false, "message": "Select a tracked rig component."}'
          if text.count(old_message) != 2:
              raise SystemExit(f"Inventory tracked-tackle message count: {text.count(old_message)}; expected 2")
          p.write_text(text.replace(old_message, new_message))
          '''
          if text.count(old) != 1:
              raise SystemExit('Could not find duplicate inventory-message audit block')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Apply audited source corrections
        run: python3 tools/apply_phase2p_audit.py
      - name: Remove transformation scaffolding
        run: |
          git rm -f \
            tools/apply_phase2p_audit.py \
            .github/workflows/phase2p_audit_apply.yml \
            .github/workflows/phase2p_audit_retry.yml \
            tools/apply_phase2p.py \
            tools/fix_phase2p_types.py \
            .github/workflows/phase2p_apply.yml \
            .github/workflows/phase2p_typefix.yml
      - name: Commit audited Phase 2P state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Audit and harden Phase 2P'
          git push origin HEAD:phase-2p-audit-fix
