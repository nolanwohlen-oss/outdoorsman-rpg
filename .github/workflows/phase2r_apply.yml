name: Apply Phase 2R hook-set integration

on:
  push:
    branches: [phase-2r-hookset-causality]
    paths:
      - tools/apply_phase2r.py
      - .github/workflows/phase2r_apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase-2r-hookset-causality
          fetch-depth: 0
      - name: Apply Phase 2R source changes
        run: python3 tools/apply_phase2r.py
      - name: Remove branch-only transformation scaffolding
        run: rm tools/apply_phase2r.py .github/workflows/phase2r_apply.yml
      - name: Commit integrated Phase 2R state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Phase 2R: integrate strike-response and hook-set causality'
          git push origin HEAD:phase-2r-hookset-causality
