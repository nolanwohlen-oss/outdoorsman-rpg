name: Apply Phase 2P

on:
  push:
    branches: [phase-2p-rig-causality]
    paths:
      - tools/apply_phase2p.py
      - tests/phase_2p.gd
      - docs/PHASE_2P.md
      - .github/workflows/phase2p_apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase-2p-rig-causality
      - name: Apply source transformation
        run: python3 tools/apply_phase2p.py
      - name: Commit generated Phase 2P changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulation/inventory.gd simulation/fishing.gd simulation/kernel.gd scripts/main.gd tools/prepare_build.py tools/check.sh project.godot
          if git diff --cached --quiet; then
            echo 'Phase 2P already applied.'
          else
            git commit -m 'Implement Phase 2P rig causality'
            git push origin HEAD:phase-2p-rig-causality
          fi
