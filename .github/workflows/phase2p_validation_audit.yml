name: Apply final Phase 2P validation audit

on:
  push:
    branches: [phase-2p-audit-fix]
    paths:
      - tools/apply_phase2p_validation_audit.py
      - .github/workflows/phase2p_validation_audit.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase-2p-audit-fix
      - name: Apply final audit corrections
        run: python3 tools/apply_phase2p_validation_audit.py
      - name: Remove final audit scaffolding
        run: git rm -f tools/apply_phase2p_validation_audit.py .github/workflows/phase2p_validation_audit.yml
      - name: Commit final audited state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close Phase 2P full-audit findings'
          git push origin HEAD:phase-2p-audit-fix
