name: Fix Phase 2P typing

on:
  push:
    branches: [phase-2p-rig-causality]
    paths:
      - tools/fix_phase2p_types.py
      - .github/workflows/phase2p_typefix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase-2p-rig-causality
      - run: python3 tools/fix_phase2p_types.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulation/inventory.gd simulation/kernel.gd
          if git diff --cached --quiet; then
            echo 'Typing fix already applied.'
          else
            git commit -m 'Fix Phase 2P strict typing'
            git push origin HEAD:phase-2p-rig-causality
          fi
