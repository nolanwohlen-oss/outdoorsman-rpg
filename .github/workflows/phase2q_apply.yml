name: Apply Phase 2Q source transformation

on:
  push:
    branches: [phase-2q-presentation-strike]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run Phase 2Q source transformation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase-2q-presentation-strike
      - name: Apply Phase 2Q
        run: python3 tools/apply_phase2q.py
      - name: Remove branch-only transformation scaffolding
        run: rm tools/apply_phase2q.py .github/workflows/phase2q_apply.yml
      - name: Commit Phase 2Q source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Phase 2Q: add presentation and strike causality'
          git push origin HEAD:phase-2q-presentation-strike
