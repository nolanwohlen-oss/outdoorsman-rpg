name: Build test app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache pinned editor and export templates
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/godot
          key: godot-linux-${{ hashFiles('.godot-version', 'tools/install_godot.sh') }}

      - name: Install Godot and debug templates
        run: bash tools/install_godot.sh --templates

      - name: Validate simulation and persistence
        run: bash tools/check.sh

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android export tools
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1'

      - name: Restore development signing key
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/debug-signing
          key: outdoorsman-android-debug-signing-v1

      - name: Prepare development signing and build metadata
        shell: bash
        run: |
          mkdir -p .tools/debug-signing build/android build/linux
          if [ ! -f .tools/debug-signing/debug.keystore ]; then
            keytool -genkeypair -noprompt -keystore .tools/debug-signing/debug.keystore -storetype JKS -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
          python3 tools/prepare_build.py

      - name: Export Android APK
        run: .tools/godot/godot --headless --path . --export-debug Android build/android/outdoorsman-test.apk

      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/35.0.1/apksigner verify --verbose build/android/outdoorsman-test.apk"

      - name: Export and launch Linux desktop build
        shell: bash
        run: |
          .tools/godot/godot --headless --path . --export-debug Linux build/linux/outdoorsman-test.x86_64
          chmod +x build/linux/outdoorsman-test.x86_64
          timeout 30 build/linux/outdoorsman-test.x86_64 --headless --quit-after 3 2>&1 | tee build/desktop.log
          if grep -E 'SCRIPT ERROR:|^ERROR:' build/desktop.log; then exit 1; fi

      - name: Capture desktop preview
        run: timeout 60 xvfb-run -a .tools/godot/godot --path . --script tests/capture.gd

      - name: Upload Android test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: outdoorsman-android-debug
          path: build/android/outdoorsman-test.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux desktop test
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: outdoorsman-linux-debug
          path: build/linux/
          if-no-files-found: error
          retention-days: 30

      - name: Upload checks and preview
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: outdoorsman-build-checks
          path: |
            build/*.log
            build/*-preview.png
          retention-days: 30