name: Apply Phase 2Q legacy fixture correction

on:
  push:
    branches: [phase-2q-presentation-strike]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run Phase 2Q legacy fixture correction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase-2q-presentation-strike
      - name: Correct historical downgrade fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/run.gd')
          text = p.read_text()
          old = '"fish_cue", "lost_count"]'
          new = '"fish_cue", "lost_count", "presentation", "strike_cue"]'
          count = text.count(old)
          if count < 1:
              raise SystemExit('No legacy fishing downgrade field lists found')
          p.write_text(text.replace(old, new))
          print(f'Updated {count} historical downgrade field list(s).')
          PY
      - name: Remove branch-only correction workflow
        run: rm .github/workflows/phase2q_legacy_fixture_fix.yml
      - name: Commit fixture correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align legacy migration fixtures with fishing v6'
          git push origin HEAD:phase-2q-presentation-strike
